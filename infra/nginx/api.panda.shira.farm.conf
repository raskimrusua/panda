# =============================================================================
# Panda — nginx vhost for api.panda.shira.farm
# Co-located on Shira's CX22; shares Origin Cert (must include the SAN).
# Append to /root/farmcore/nginx.conf inside the http {} block, OR mount this
# file via an `include` directive (preferred — less risk of breaking Shira).
# =============================================================================

upstream panda_app_upstream {
    server panda_app:9000;
}

# --- HTTP server (redirect to HTTPS) ---
server {
    listen 80;
    server_name api.panda.shira.farm;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.panda.shira.farm;

    # Shared CF Origin Certificate (must include *.panda.shira.farm in SAN)
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;

    # Health endpoint (Laravel `/up` provided by `withRouting(health: '/up')`)
    location = /up {
        fastcgi_pass panda_app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI /up;
        include fastcgi_params;
        access_log off;
    }

    # Auth endpoints (login/register/logout — stricter rate limit)
    location ~ ^/api/v1/auth/ {
        limit_req zone=login burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # General API
    location ~ ^/api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Filament admin panel
    location ~ ^/admin/ {
        limit_req zone=general burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Horizon dashboard (admin-only access enforced at app layer)
    location ~ ^/horizon/ {
        limit_req zone=general burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM passthrough — Laravel public/index.php as front controller
    location ~ \.php$ {
        fastcgi_pass panda_app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Default: Laravel front controller pattern
    location / {
        try_files $uri /index.php?$query_string;
    }
}
